name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate title
        env:
          # Passed through the environment so the title is never interpolated into the shell script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$PR_TITLE"
